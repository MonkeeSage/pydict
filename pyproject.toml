[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydict"
version = "1.0.0"
description = "A terminal and browser StarDict dictionary viewer built with Textual"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MonkeeSage", email = "monkeesage@gmail.com" }]
keywords = ["stardict", "dictionary", "tui", "textual", "sdcv"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
web = ["textual-serve>=1.1"]

[project.scripts]
pydict = "pydict.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual-serve>=1.1"]

[tool.hatch.build.targets.sdist]
include = ["/src/pydict", "/tests", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pydict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
